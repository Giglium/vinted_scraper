---
name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions: {}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: "./.github/actions/setup-python"

      - name: Build the package
        run: make build

      - name: Set package file info
        id: pkg
        # yamllint disable rule:line-length
        run: |
          shopt -s nullglob
          FILES=(dist/*.whl)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No .whl file found in dist/"
            exit 1
          fi
          FILE="${FILES[0]}"
          echo "FILE_PATH=$FILE" >> "$GITHUB_ENV"
          FILE_PREFIX=$(basename "$FILE" | sed -E 's/^([^-]+-[0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "FILE_NAME=$FILE_PREFIX" >> "$GITHUB_ENV"
        # yamllint enable rule:line-length

      - name: Generate a changelog
        # yamllint disable-line rule:line-length
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        id: git-cliff
        if: ${{ !env.ACT }}
        with:
          config: github-keepachangelog
          args: -v --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload whl file to release
        if: ${{ !env.ACT }}
        # yamllint disable-line rule:line-length
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.FILE_PATH }}
          asset_name: ${{ env.FILE_NAME }}.whl
          tag: ${{ github.ref }}
          body: ${{ steps.git-cliff.outputs.content }}
          overwrite: true

      # yamllint disable-line rule:line-length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !env.ACT }}
        with:
          name: dist
          path: dist/

  publish:
    needs: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/vinted_scraper

    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !env.ACT }}
        with:
          name: dist
          path: dist/

      - name: Publish the package to PyPI
        if: ${{ !env.ACT }}
        # yamllint disable-line rule:line-length
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
