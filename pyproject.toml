[project]
name = "vinted_scraper"
version = "5.0.3"
description = "A very simple Python package for scraping Vinted. Supports both synchronous and asynchronous operations with automatic cookie management and typed responses."
readme = "README.md"
requires-python = ">= 3.8"
authors = [{ name = "Giglium" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "httpx[brotli]>=0.28.1 ; python_full_version >= '3.8'",
]

[tool.isort]
profile = "black"

[tool.coverage.run]
relative_files = true
source = ["src"]

[project.urls]
Changelog = "https://github.com/Giglium/vinted_scraper/releases"
Documentation = "https://github.com/Giglium/vinted_scraper"
Homepage = "https://github.com/Giglium/vinted_scraper"
Issues = "https://github.com/Giglium/vinted_scraper/issues"
Source = "https://github.com/Giglium/vinted_scraper"

[build-system]
requires = ["uv_build>=0.8.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black==26.10.1 ; python_full_version == '3.15.*'",
    "coverage==7.16.2 ; python_full_version == '3.15.*'",
    "isort==9.0.2 ; python_full_version == '3.15.*'",
    "pdoc==16.0.0 ; python_full_version == '3.15.*'",
]
